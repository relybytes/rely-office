<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rely-office editors</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; }
      nav { display: flex; gap: 8px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #d0d7de; }
      nav button { padding: 6px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; }
      nav button[aria-pressed='true'] { background: #dbeafe; border-color: #2563eb; }
      main { height: calc(100vh - 50px); }
      .together { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 100%; padding: 12px; box-sizing: border-box; }
      .together section { display: flex; flex-direction: column; min-width: 0; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden; }
      .together header { padding: 8px 12px; font-weight: 600; border-top: 4px solid; border-bottom: 1px solid #d0d7de; }
      .together section > :last-child { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
