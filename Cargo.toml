[workspace]
resolver = "3"
members = ["crates/rely-office-core", "crates/rely-office-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
authors = ["RelyBytes Consulting"]
repository = "https://github.com/relybytes/rely-office"
homepage = "https://relybytes.com"
keywords = ["docx", "xlsx", "ods", "office", "preview"]
categories = ["parser-implementations", "text-processing"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
