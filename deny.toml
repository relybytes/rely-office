# Licences a dependency may carry: each is compatible with distributing rely-office under Apache-2.0.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  # roman-numerals-rs, through Typst's bibliography support.
  "0BSD",
  # ar_archive_writer, a build-time dependency of stacker through Typst.
  "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# All reached through Typst, which rely-office-render pins; each is revisited on a Typst upgrade.
ignore = [
  # quick-xml 0.38 inside citationberg parses CSL styles and bibliographies. The source
  # rely-office-render writes never loads either, so no input of ours reaches that parser.
  { id = "RUSTSEC-2026-0194", reason = "CSL parsing only, never reached by generated sources" },
  { id = "RUSTSEC-2026-0195", reason = "CSL parsing only, never reached by generated sources" },
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, used by syntect inside Typst" },
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, a proc macro inside Typst" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained, Typst's text shaper" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, Typst's font parser" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, used by Typst's YAML loader" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained, used by syntect inside Typst" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
