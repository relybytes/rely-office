name: Release

# A tag v<version> publishes @relybytes/rely-office at that version to GitHub Packages. The tag must
# match the version of packages/rely-office-node/package.json and of the Cargo workspace.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish @relybytes/rely-office to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@relybytes'
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./packages/rely-office-node/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        run: cargo install wasm-bindgen-cli --version "$(node scripts/build-npm.mjs --print-bindgen-version)" --locked
      - name: Build the npm package
        run: node scripts/build-npm.mjs
      - name: Smoke test the package
        run: node packages/rely-office-node/test/smoke.cjs
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish dist/*.tgz
