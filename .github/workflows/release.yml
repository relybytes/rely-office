name: Release

# A tag v<version> publishes both packages at that version to GitHub Packages: @relybytes/rely-office
# for the backend and @relybytes/rely-office-react for the frontend. The tag must match the version
# of both package.json files and of the Cargo workspace. A manual run publishes the version on the
# branch it runs from.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish the npm packages to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@relybytes'
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/rely-office-node/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        run: cargo install wasm-bindgen-cli --version "$(node scripts/build-npm.mjs --print-bindgen-version)" --locked
      - name: Build the npm packages
        run: node scripts/build-npm.mjs
      - name: Test the editor components and smoke test both packages
        run: |
          (cd packages/rely-office-react && npm test)
          node packages/rely-office-node/test/smoke.cjs
          node packages/rely-office-react/test/smoke-dist.mjs
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tarball in ./dist/*.tgz; do
            npm publish "$tarball"
          done
