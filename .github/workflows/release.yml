name: Release

# A tag v<version> publishes both packages at that version, @relybytes/rely-office for the backend
# and @relybytes/rely-office-react for the frontend: first to GitHub Packages, then the same
# tarballs to the public npm registry when the repository secret NPM_TOKEN is set. The tag must
# match the version of both package.json files and of the Cargo workspace. A manual run publishes
# the version on the branch it runs from.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish the npm packages to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@relybytes'
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/rely-office-node/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        run: cargo install wasm-bindgen-cli --version "$(node scripts/build-npm.mjs --print-bindgen-version)" --locked
      - name: Build the npm packages
        run: node scripts/build-npm.mjs
      - name: Test the editor components and smoke test both packages
        run: |
          (cd packages/rely-office-react && npm test)
          node packages/rely-office-node/test/smoke.cjs
          node packages/rely-office-react/test/smoke-dist.mjs
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tarball in ./dist/*.tgz; do
            npm publish "$tarball" --registry https://npm.pkg.github.com
          done
      - name: Keep the tarballs for the public registry
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npmjs:
    name: Publish the npm packages to the public npm registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set, so the packages are published to GitHub Packages only"
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Take the tarballs published to GitHub Packages
        if: env.NPM_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: dist
      - name: Publish with provenance
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in ./dist/*.tgz; do
            npm publish "$tarball" --registry https://registry.npmjs.org --access public --provenance
          done
