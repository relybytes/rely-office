name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  wasm:
    name: WebAssembly package and Node smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint for WebAssembly
        run: cargo clippy --package rely-office-wasm --package rely-office-render-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        run: |
          version=$(node scripts/build-npm.mjs --print-bindgen-version)
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Build the npm package
        run: node scripts/build-npm.mjs
      - name: Smoke test the package folder
        run: node packages/rely-office-node/test/smoke.cjs
      - name: Smoke test the packed tarball
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          tar -xzf dist/*.tgz -C "$RUNNER_TEMP/packed"
          node packages/rely-office-node/test/smoke.cjs "$RUNNER_TEMP/packed/package"
      - uses: actions/upload-artifact@v4
        with:
          name: rely-office-npm
          path: dist/*.tgz
          if-no-files-found: error

  corpus:
    name: Rendering against LibreOffice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install LibreOffice, Poppler and the metric-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc \n            poppler-utils fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2
      # A regression floor, not the quality gate: docs/rendering.md records the measured share.
      - name: Render the corpus and compare it with LibreOffice page by page
        run: node scripts/corpus.mjs --min-pass-rate 0.4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rely-office-corpus
          path: |
            target/corpus/report.json
            target/corpus/ours
            target/corpus/references
          if-no-files-found: ignore

  licenses:
    name: Dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources
