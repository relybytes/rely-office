name: Fuzz

# Every reader and the source writer under libFuzzer, a few minutes each: weekly, and by hand
# after a change to a parser. A crash uploads its input as an artifact.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '300'

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [extract_text, read_workbook, read_document_tree, render, formula, spreadsheet]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ inputs.seconds || '300' }} -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts
