<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" width="960" height="628" role="img" aria-labelledby="title desc">
  <title id="title">Editing together</title>
  <desc id="desc">Anna’s page says hello to the room in the host server and is told to seed the file; Marco joins and receives the shared document; their edits and their presence pass through the room to each other; when Anna saves, the host checks the claim and the room tells Marco that nothing is unsaved.</desc>
  <defs>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
      .muted { fill: #57606a; }
      .name { font-size: 14px; font-weight: 700; }
      .small { font-size: 12px; }
      .msg { font-size: 12.5px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="627" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="44" font-size="18" font-weight="700">Editing together</text>
  <text x="196" y="44" class="small muted">the library carries both ends; the host owns the socket, who may join and where versions go</text>
  <rect x="80" y="72" width="180" height="50" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="170" y="94" class="name" text-anchor="middle" style="fill:#2563eb">Anna’s page</text>
  <text x="170" y="112" class="small muted" text-anchor="middle">CollabSession</text>
  <line x1="170" y1="122" x2="170" y2="584" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
  <rect x="390" y="72" width="180" height="50" rx="12" fill="#fefce8" stroke="#ca8a04"/>
  <text x="480" y="94" class="name" text-anchor="middle" style="fill:#ca8a04">Your server</text>
  <text x="480" y="112" class="small muted" text-anchor="middle">CollabRoom</text>
  <line x1="480" y1="122" x2="480" y2="584" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
  <rect x="700" y="72" width="180" height="50" rx="12" fill="#fdf2f8" stroke="#db2777"/>
  <text x="790" y="94" class="name" text-anchor="middle" style="fill:#db2777">Marco’s page</text>
  <text x="790" y="112" class="small muted" text-anchor="middle">CollabSession</text>
  <line x1="790" y1="122" x2="790" y2="584" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
  <line x1="170" y1="150" x2="474" y2="150" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrowGrey)"/>
  <text x="325" y="143" class="msg" text-anchor="middle">hello, with a session key</text>
  <line x1="480" y1="188" x2="176" y2="188" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrowGrey)"/>
  <text x="325" y="181" class="msg" text-anchor="middle">welcome · you seed the file</text>
  <line x1="170" y1="226" x2="474" y2="226" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrowGrey)"/>
  <text x="325" y="219" class="msg" text-anchor="middle">the file, put into the shared document</text>
  <line x1="790" y1="264" x2="486" y2="264" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrowGrey)"/>
  <text x="635" y="257" class="msg" text-anchor="middle">hello</text>
  <line x1="480" y1="302" x2="784" y2="302" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrowGrey)"/>
  <text x="635" y="295" class="msg" text-anchor="middle">welcome · the shared document</text>
  <line x1="170" y1="340" x2="474" y2="340" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="325" y="333" class="msg" text-anchor="middle" style="fill:#2563eb">an edit (Yjs update)</text>
  <line x1="480" y1="378" x2="784" y2="378" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="635" y="371" class="msg" text-anchor="middle" style="fill:#2563eb">the same edit</text>
  <line x1="790" y1="416" x2="486" y2="416" stroke="#db2777" stroke-width="1.8" marker-end="url(#arrowPink)"/>
  <text x="635" y="409" class="msg" text-anchor="middle" style="fill:#db2777">presence: caret and selection</text>
  <line x1="480" y1="454" x2="176" y2="454" stroke="#db2777" stroke-width="1.8" marker-end="url(#arrowPink)"/>
  <text x="325" y="447" class="msg" text-anchor="middle" style="fill:#db2777">Marco’s caret, drawn on Anna’s page</text>
  <line x1="170" y1="492" x2="474" y2="492" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrowGrey)"/>
  <text x="325" y="485" class="msg" text-anchor="middle">saved as version 42</text>
  <line x1="480" y1="560" x2="784" y2="560" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrowGrey)"/>
  <text x="635" y="553" class="msg" text-anchor="middle">saved · nothing unsaved</text>
  <rect x="500" y="500" width="262" height="22" rx="6" fill="#fefce8" stroke="#ca8a04"/>
  <text x="510" y="515" class="small" style="fill:#a16207">the host checks the claim, then markSaved()</text>
  <text x="32" y="612" class="small muted">Documents, slides and text merge as a CRDT (Yjs); a spreadsheet is a log of operations the room puts in one order.</text>
</svg>
