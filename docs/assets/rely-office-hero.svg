      <rect x="0" y="0" width="180" height="30" rx="10" fill="#15803d"/>
      <rect x="0" y="20" width="180" height="10" fill="#15803d"/>
      <g stroke="#e2e8f0" stroke-width="1">
        <path d="M14 50 H166 M14 70 H166 M14 90 H166 M14 110 H166 M14 130 H166 M60 50 V130 M104 50 V130"/>
      </g>
      <rect x="14" y="50" width="152" height="20" fill="#dbeafe" opacity="0.8"/>
      <rect x="24" y="200" width="18" height="14" fill="#4472c4"/>
      <rect x="50" y="184" width="18" height="30" fill="#4472c4"/>
      <rect x="76" y="172" width="18" height="42" fill="#4472c4"/>
      <rect x="102" y="190" width="18" height="24" fill="#ed7d31"/>
      <rect x="128" y="160" width="18" height="54" fill="#ed7d31"/>
      <path d="M18 214 H160" stroke="#94a3b8"/>
    </g>
    <g transform="translate(912 118) rotate(-1) scale(0.84)">
      <rect width="190" height="244" rx="10" fill="#ffffff"/>
      <rect x="0" y="0" width="190" height="30" rx="10" fill="#1d4ed8"/>
      <rect x="0" y="20" width="190" height="10" fill="#1d4ed8"/>
      <rect x="20" y="50" width="120" height="13" rx="3" fill="#0f172a"/>
