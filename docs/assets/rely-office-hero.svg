      <rect x="20" y="98" width="150" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="60" y="96" width="62" height="10" rx="2" fill="#db2777" opacity="0.25"/>
      <rect x="121" y="92" width="2" height="16" fill="#db2777"/>
      <rect x="121" y="80" width="40" height="12" rx="2" fill="#db2777"/>
      <text x="125" y="89" font-size="8" font-weight="700" fill="#ffffff">Marco</text>
      <rect x="20" y="118" width="130" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="20" y="130" width="150" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="20" y="150" width="150" height="50" rx="4" fill="none" stroke="#cbd5e1"/>
      <path d="M20 166 H170 M20 183 H170 M95 150 V200" stroke="#cbd5e1"/>
      <rect x="20" y="212" width="110" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="40" y="132" width="2" height="16" fill="#2563eb"/>
      <rect x="40" y="118" width="34" height="12" rx="2" fill="#2563eb"/>
      <text x="44" y="127" font-size="8" font-weight="700" fill="#ffffff">Anna</text>
    </g>
  </g>
</svg>
