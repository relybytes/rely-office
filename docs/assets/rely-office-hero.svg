<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">rely-office</title>
  <desc id="desc">rely-office reads, draws, edits and writes Word, Excel, PowerPoint and OpenDocument files in safe Rust compiled to WebAssembly, with React editors that several people can use together.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1437"/>
      <stop offset="0.55" stop-color="#1e2a78"/>
      <stop offset="1" stop-color="#3b1d8f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .name { font-size: 64px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
      .tag { font-size: 22px; fill: #c7d2fe; }
      .stat { font-size: 26px; font-weight: 800; fill: #ffffff; }
      .unit { font-size: 13px; fill: #a5b4fc; letter-spacing: 0.04em; }
      .chip { font-size: 13px; font-weight: 700; }
      .paper { font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#ground)"/>
  <circle cx="1010" cy="40" r="220" fill="#6366f1" opacity="0.18"/>
  <circle cx="820" cy="380" r="160" fill="#38bdf8" opacity="0.12"/>

  <text x="56" y="116" class="name">rely-office</text>
  <rect x="58" y="134" width="132" height="5" rx="2.5" fill="url(#glow)"/>
  <text x="56" y="182" class="tag">Office files without an office suite.</text>
  <text x="56" y="212" class="tag">Safe Rust, WebAssembly, in process: read, draw, edit, save, together.</text>

  <g transform="translate(56 248)">
    <text x="0" y="28" class="stat">17</text><text x="0" y="50" class="unit">FORMATS</text>
    <text x="118" y="28" class="stat">502</text><text x="118" y="50" class="unit">SHEET FUNCTIONS</text>
    <text x="268" y="28" class="stat">4</text><text x="268" y="50" class="unit">REACT EDITORS</text>
    <text x="398" y="28" class="stat">17/17</text><text x="398" y="50" class="unit">PAGES MATCH LIBREOFFICE</text>
  </g>
  <g transform="translate(56 330)" class="chip" text-anchor="middle">
    <rect x="0" y="0" width="70" height="26" rx="13" fill="#1d4ed8"/><text x="35" y="18" fill="#dbeafe">docx</text>
    <rect x="78" y="0" width="70" height="26" rx="13" fill="#1d4ed8"/><text x="113" y="18" fill="#dbeafe">doc</text>
    <rect x="156" y="0" width="70" height="26" rx="13" fill="#1d4ed8"/><text x="191" y="18" fill="#dbeafe">odt</text>
    <rect x="234" y="0" width="70" height="26" rx="13" fill="#15803d"/><text x="269" y="18" fill="#dcfce7">xlsx</text>
    <rect x="312" y="0" width="70" height="26" rx="13" fill="#15803d"/><text x="347" y="18" fill="#dcfce7">ods</text>
    <rect x="390" y="0" width="70" height="26" rx="13" fill="#15803d"/><text x="425" y="18" fill="#dcfce7">csv</text>
    <rect x="468" y="0" width="70" height="26" rx="13" fill="#c2410c"/><text x="503" y="18" fill="#ffedd5">pptx</text>
    <rect x="546" y="0" width="70" height="26" rx="13" fill="#c2410c"/><text x="581" y="18" fill="#ffedd5">odp</text>
    <rect x="624" y="0" width="70" height="26" rx="13" fill="#475569"/><text x="659" y="18" fill="#e2e8f0">md</text>
    <rect x="702" y="0" width="70" height="26" rx="13" fill="#475569"/><text x="737" y="18" fill="#e2e8f0">txt</text>
  </g>

  <!-- three pages, fanned -->
  <g filter="url(#shadow)">
    <g transform="translate(800 92) rotate(-11)">
      <rect width="180" height="232" rx="10" fill="#ffffff"/>
      <rect x="0" y="0" width="180" height="30" rx="10" fill="#c2410c"/>
      <rect x="0" y="20" width="180" height="10" fill="#c2410c"/>
      <rect x="18" y="52" width="96" height="12" rx="3" fill="#1e3a8a"/>
