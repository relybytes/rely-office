<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="title desc">
  <title id="title">rely-office roadmap</title>
  <desc id="desc">Releases 0.1 to 0.6 read, render, write and edit every format; 0.7 adds the React editor components for documents, sheets and slides, in a frontend package of their own.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
      .muted { fill: #57606a; }
      .version { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
      .name { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="249" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="44" font-size="18" font-weight="700">Roadmap</text>
  <text x="128" y="44" class="small muted">seven releases, from reading a file to editing it in the browser</text>

  <line x1="80" y1="118" x2="740" y2="118" stroke="#2563eb" stroke-width="3"/>
  <line x1="740" y1="118" x2="848" y2="118" stroke="#7c3aed" stroke-width="3"/>

  <g text-anchor="middle">
    <text x="80" y="94" class="version muted">0.1 - 0.2</text>
    <circle cx="80" cy="118" r="11" fill="#2563eb"/>
    <path d="M74 118 l4 4 l8 -8" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <text x="80" y="152" class="name">Read and index</text>
    <text x="80" y="170" class="small muted">text and trees</text>

    <text x="212" y="94" class="version muted">0.3</text>
    <circle cx="212" cy="118" r="11" fill="#2563eb"/>
    <path d="M206 118 l4 4 l8 -8" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <text x="212" y="152" class="name">Render and write</text>
    <text x="212" y="170" class="small muted">PDF via Typst, docx back</text>

    <text x="344" y="94" class="version muted">0.4</text>
    <circle cx="344" cy="118" r="11" fill="#2563eb"/>
    <path d="M338 118 l4 4 l8 -8" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <text x="344" y="152" class="name">Fidelity</text>
    <text x="344" y="170" class="small muted">notes, styles, charts</text>

    <text x="476" y="94" class="version muted">0.5</text>
    <circle cx="476" cy="118" r="11" fill="#2563eb"/>
    <path d="M470 118 l4 4 l8 -8" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <text x="476" y="152" class="name">Layout</text>
    <text x="476" y="170" class="small muted">floats, doc and ppt</text>

    <text x="608" y="94" class="version muted">0.6</text>
    <circle cx="608" cy="118" r="11" fill="#2563eb"/>
    <path d="M602 118 l4 4 l8 -8" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <text x="608" y="152" class="name">Draw and edit</text>
    <text x="608" y="170" class="small muted">slides, equations</text>

    <rect x="816" y="76" width="64" height="22" rx="11" fill="#ede9fe"/>
    <text x="848" y="91" class="version" style="fill:#6d28d9">0.7</text>
    <circle cx="848" cy="118" r="13" fill="#7c3aed"/>
    <path d="M841 118 l5 5 l9 -9" stroke="#ffffff" stroke-width="2.4" fill="none"/>
  </g>

  <rect x="740" y="140" width="196" height="86" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="756" y="164" class="name" style="fill:#5b21b6">Editor components</text>
  <text x="756" y="184" class="small muted">React, in the browser:</text>
  <text x="756" y="201" class="small muted">documents, sheets, slides</text>
  <text x="756" y="218" class="small" style="fill:#6d28d9">@relybytes/rely-office-react</text>
</svg>
