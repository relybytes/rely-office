<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title desc">
  <title id="title">rely-office roadmap</title>
  <desc id="desc">Releases 0.1 to 0.10: read and index, render and write, fidelity, layout, draw and edit, editor components, complete editing, editing together, and the finished library with pivot layouts, charts drawn in the grid, formula references moved in shared edits and the fonts embedded in a doc.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="0.7" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
      .muted { fill: #57606a; }
      .version { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
      .name { font-size: 13px; font-weight: 600; }
      .small { font-size: 11px; }
      .card { font-size: 12px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="299" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="44" font-size="18" font-weight="700">Roadmap</text>
  <text x="128" y="44" class="small muted" font-size="12">ten releases, from reading a file to a suite people edit together</text>
  <line x1="64" y1="122" x2="896" y2="122" stroke="url(#line)" stroke-width="3"/>
  <g text-anchor="middle">
    <text x="64" y="98" class="version muted">0.1 - 0.2</text>
    <circle cx="64" cy="122" r="10" fill="#2563eb"/><path d="M59 122 l3.5 3.5 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="64" y="156" class="name">Read and index</text>
    <text x="64" y="173" class="small muted">text and trees</text>
    <text x="168" y="98" class="version muted">0.3</text>
    <circle cx="168" cy="122" r="10" fill="#2563eb"/><path d="M163 122 l3.5 3.5 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="168" y="156" class="name">Render and write</text>
    <text x="168" y="173" class="small muted">PDF via Typst</text>
    <text x="272" y="98" class="version muted">0.4</text>
    <circle cx="272" cy="122" r="10" fill="#2563eb"/><path d="M267 122 l3.5 3.5 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="272" y="156" class="name">Fidelity</text>
    <text x="272" y="173" class="small muted">notes, styles</text>
    <text x="376" y="98" class="version muted">0.5</text>
    <circle cx="376" cy="122" r="10" fill="#2563eb"/><path d="M371 122 l3.5 3.5 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="376" y="156" class="name">Layout</text>
    <text x="376" y="173" class="small muted">floats, doc, ppt</text>
    <text x="480" y="98" class="version muted">0.6</text>
    <circle cx="480" cy="122" r="10" fill="#2563eb"/><path d="M475 122 l3.5 3.5 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="480" y="156" class="name">Draw and edit</text>
    <text x="480" y="173" class="small muted">slides, equations</text>
    <text x="584" y="98" class="version muted">0.7</text>
    <circle cx="584" cy="122" r="10" fill="#2563eb"/><path d="M579 122 l3.5 3.5 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="584" y="156" class="name">Editors</text>
    <text x="584" y="173" class="small muted">React components</text>
    <text x="688" y="98" class="version muted">0.8</text>
    <circle cx="688" cy="122" r="10" fill="#4f46e5"/><path d="M683 122 l3.5 3.5 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="688" y="156" class="name">Complete editing</text>
    <text x="688" y="173" class="small muted">formats as themselves</text>
    <text x="792" y="98" class="version muted">0.9</text>
    <circle cx="792" cy="122" r="10" fill="#4f46e5"/><path d="M787 122 l3.5 3.5 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="792" y="156" class="name">Together</text>
    <text x="792" y="173" class="small muted">real-time, pivots</text>
    <rect x="866" y="80" width="60" height="22" rx="11" fill="#ede9fe"/><text x="896" y="95" class="version" style="fill:#6d28d9">0.10</text>
    <circle cx="896" cy="122" r="13" fill="#7c3aed"/><path d="M889 122 l5 5 l9 -9" stroke="#ffffff" stroke-width="2.4" fill="none"/>
    <text x="896" y="156" class="name">Finished</text>
    <text x="896" y="173" class="small muted">the last limits</text>
  </g>
  <rect x="32" y="200" width="291" height="78" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="48" y="224" class="name" style="fill:#1e40af">0.7 Editors</text>
  <text x="48" y="245" class="card muted">DocumentEditor, SheetGrid, SlideEditor</text><text x="48" y="264" class="card muted">in a frontend package of their own</text>
  <rect x="335" y="200" width="291" height="78" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="351" y="224" class="name" style="fill:#3730a3">0.8 - 0.9 Complete, together</text>
  <text x="351" y="245" class="card muted">every format saved as itself, 502 functions,</text><text x="351" y="264" class="card muted">pivots, threads, real-time editing</text>
  <rect x="637" y="200" width="291" height="78" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="653" y="224" class="name" style="fill:#5b21b6">0.10 Finished</text>
  <text x="653" y="245" class="card muted">pivot layouts, charts drawn in the grid,</text><text x="653" y="264" class="card muted">references moved, the fonts of a .doc</text>
</svg>
