[package]
name = "rely-office-render-wasm"
description = "WebAssembly front of rely-office-render for Node: office documents to PDF and PNG."
readme = "../../README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rely-office-render = { path = "../rely-office-render", version = "0.10.1" }
rely-office-wasm = { path = "../rely-office-wasm" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "=0.2.129"
