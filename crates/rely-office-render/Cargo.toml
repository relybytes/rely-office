[package]
name = "rely-office-render"
description = "Renders office documents (docx, xlsx, xls, ods, csv) to PDF and PNG thumbnails through Typst, with no office suite."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
comemo = "0.5.1"
rely-office-core = { path = "../rely-office-core", version = "0.6.0" }
rely-office-sheet = { path = "../rely-office-sheet", version = "0.6.0" }
thiserror = "2.0.21"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"

[dev-dependencies]
rust_xlsxwriter = "0.101"
zip = { version = "9", default-features = false, features = ["deflate"] }
