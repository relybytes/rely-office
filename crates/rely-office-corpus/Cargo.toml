[package]
name = "rely-office-corpus"
description = "Compares the pages rely-office-render draws with the pages LibreOffice prints, document by document."
readme = "../../README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "rely-office-corpus"
path = "src/main.rs"

[dependencies]
rely-office-render = { path = "../rely-office-render", version = "0.6.0" }
serde_json = "1.0.149"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "png-format"] }
