[package]
name = "rely-office-wasm"
description = "WebAssembly front of rely-office for Node: format detection, text extraction, sheet tables and the docx document tree."
readme = "../../README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rely-office-core = { path = "../rely-office-core", version = "0.4.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
