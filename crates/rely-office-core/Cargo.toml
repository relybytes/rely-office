[package]
name = "rely-office-core"
description = "Reads office documents (docx, xlsx, pptx, odt, ods, odp, doc, xls, ppt, csv) for previews, search and import: format detection, text extraction, sheet tables and a docx document tree."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
calamine = "0.37"
cfb = "0.15.0"
encoding_rs = "0.8.35"
html5gum = { version = "0.9.0", default-features = false }
pulldown-cmark = { version = "0.13.5", default-features = false }
quick-xml = "0.42"
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
# Serialize the document tree and its report, for a JSON boundary such as the WebAssembly package.
serde = ["dep:serde"]

[dev-dependencies]
rust_xlsxwriter = "0.101"
serde_json = "1.0.149"
