[package]
name = "rely-office-core"
description = "Reads office documents (docx, xlsx, pptx, odt, ods, odp, doc, xls, ppt, csv) for previews and search: format detection, text extraction and sheet tables."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
calamine = "0.37"
cfb = "0.15.0"
encoding_rs = "0.8.35"
quick-xml = "0.42"
thiserror = "2.0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
rust_xlsxwriter = "0.101"
